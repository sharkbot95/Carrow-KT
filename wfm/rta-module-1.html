<script>
const M={n:1,t:"The WFM Ecosystem and the RTA Role",lvl:"Level 1: Foundation",lab:"30 to 45 min",next:"Module 2, Contact Center Operations Fundamentals"};
const LS=[
{t:"What is workforce management?",m:"15 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Define workforce management (WFM) in one sentence</li><li>Explain why contact centers cannot simply "hire enough"</li></ul></div>
<p><b>Workforce management</b> is the discipline of having the right number of people, with the right skills, in the right place, at the right time, at the lowest cost that still meets service targets.</p>
<h3>The balancing problem</h3>
<p>Customers contact you at times you do not control, and you cannot store service for later the way a shop stores stock. Every interval of the day forces a trade-off:</p>
<div class="sc"><table><tr><th>If you have too few agents</th><th>If you have too many agents</th></tr>
<tr><td>Long waits, abandoned contacts, unhappy customers, missed SLAs</td><td>Paid time with no work, higher cost per contact, low occupancy</td></tr>
<tr><td>Stressed agents with very high occupancy and burnout risk</td><td>Bored agents and wasted budget</td></tr></table></div>
<div class="viz" data-v="balance" aria-live="off" role="group" aria-label="Interactive chart: staffing versus customer demand"></div><h3>Why it is hard</h3>
<ul><li><b>Demand is random.</b> Even a perfect forecast is off by some amount in every interval.</li><li><b>Labor is the biggest cost.</b> Labor is commonly cited at roughly 60 to 70 percent of a contact center's operating cost, so small percentage gaps are expensive.</li><li><b>Supply is slow to change.</b> You cannot hire or train someone in the middle of a Monday morning peak.</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>WFM balances service level, cost, and agent experience.</li><li>Real-time analysts exist because plans are never perfectly right.</li></ul></div>
<div class="try"><b>Try it</b>Think of the last time you waited on hold. Was it likely a staffing shortfall, a surprise spike, or an outage? Write one sentence on how you would tell the difference from data.</div>`},
{t:"The WFM cycle",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>List the six stages of the WFM cycle in order</li><li>Explain what each stage produces for the next one</li></ul></div>
<p>WFM works as a loop. Each stage hands a product to the next, and the last stage feeds learning back to the first.</p><div class="viz" data-v="cycle" aria-live="off" role="group" aria-label="Animated diagram of the six-stage WFM loop"></div>
<div class="sc"><table><tr><th>Stage</th><th>Time horizon</th><th>Main output</th></tr>
<tr><td>1. Forecasting</td><td>Weeks to months</td><td>Volume and AHT by interval</td></tr>
<tr><td>2. Capacity planning</td><td>Months to years</td><td>Headcount and hiring plan</td></tr>
<tr><td>3. Staffing requirements</td><td>Weeks</td><td>Agents needed per interval (for example via Erlang C)</td></tr>
<tr><td>4. Scheduling</td><td>Days to weeks</td><td>Shifts, breaks, and time off</td></tr>
<tr><td><b>5. Intraday / real-time</b></td><td><b>Today</b></td><td>Adjustments that protect service and cost</td></tr>
<tr><td>6. Reporting and analysis</td><td>Daily to monthly</td><td>Variance explanations and improvements</td></tr></table></div>
<h3>One interval, followed through the cycle</h3>
<p>The forecast says <b>120 calls</b> between 10:00 and 10:30 with an AHT of <b>300 seconds</b>. That is 120 × 300 ÷ 1,800 = <b>20 Erlangs</b> of workload. Requirements turn that into an agent number, scheduling places agents to cover it, and then, on the day, the RTA watches what actually arrives. If 150 calls show up, workload becomes 25 Erlangs, which is 25% higher. Reporting records why, so forecasting can learn from it.</p>
<div class="key"><b>Key takeaways</b><ul><li>Real-time is stage 5: the only stage that happens while customers are waiting.</li><li>The RTA's best inputs are the plan from stages 2 to 4. Their best output is feedback into stage 6.</li></ul></div>
<div class="try"><b>Try it</b>Open the Carrow WFM Formula Toolkit and enter 150 calls, 30-minute interval, AHT 300. Confirm you get 25 Erlangs.</div>`},
{t:"WFM team structure",m:"15 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Name the main WFM roles and what each owns</li><li>Say where the RTA sits and who they work with</li></ul></div>
<div class="sc"><table><tr><th>Role</th><th>Owns</th></tr>
<tr><td>Capacity planner</td><td>Long-term headcount, hiring, and budget scenarios</td></tr>
<tr><td>Forecaster</td><td>Volume and AHT forecasts, seasonality, special events</td></tr>
<tr><td>Scheduler</td><td>Shifts, breaks, shift bids, leave approval</td></tr>
<tr><td><b>Real-Time Analyst</b></td><td><b>Intraday monitoring, adherence, and corrective actions</b></td></tr>
<tr><td>Reporting analyst</td><td>Performance reports and dashboards</td></tr>
<tr><td>WFM manager</td><td>Strategy, tooling, stakeholder alignment</td></tr></table></div>
<p>In small centers one person may do several of these jobs. The skills still differ.</p>
<h3>Who the RTA works with</h3>
<ul><li><b>Agents:</b> receive alerts and adherence reminders</li><li><b>Team leads:</b> act on adherence and coaching requests</li><li><b>Operations managers:</b> approve overtime, VTO, and emergency support</li><li><b>IT / telephony:</b> confirm and resolve outages</li><li><b>Forecasters and schedulers:</b> receive variance feedback</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>The RTA detects and recommends. Others often decide and enforce.</li><li>Influence comes from accurate data and consistency, not from rank.</li></ul></div>
<div class="try"><b>Try it</b>Draw your own organization chart for a 100-agent center and mark who the RTA must be able to reach within 5 minutes.</div>`},
{t:"The RTA mission and a day in the life",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>State the RTA mission</li><li>Describe the rhythm of a typical shift</li></ul></div>
<p><b>The RTA mission:</b> protect today's service level and efficiency, using the plan as a baseline and judgment as a tool.</p>
<h3>A note on terminology</h3>
<p>"RTA" is used in two ways: <b>Real-Time Analyst</b> (the role) and <b>real-time adherence</b> (watching whether agents follow their schedules). Many industry writers also separate real-time adherence, which checks that people follow the schedule, from <b>intraday management</b>, which checks whether the schedule still fits today's demand and acts on it. In many centers one analyst does both, and this course teaches both.</p>
<div class="viz" data-v="monitor" aria-live="off" role="group" aria-label="Animated chart: forecast versus actual calls with a moving now marker"></div><h3>A typical shift</h3>
<div class="sc"><table><tr><th>When</th><th>Activity</th></tr>
<tr><td>Start of shift</td><td>Read the handover, check the day's forecast against the schedule, spot the tight intervals, confirm data feeds work</td></tr>
<tr><td>Every 15 to 30 min</td><td>Check volume, AHT, service level, longest wait, staffed vs required, adherence exceptions</td></tr>
<tr><td>When something drifts</td><td>Diagnose, choose a lever, communicate, log, and check the result</td></tr>
<tr><td>Throughout</td><td>Track breaks, lunches, and offline activities so they do not collide with peaks</td></tr>
<tr><td>End of shift</td><td>Send the end-of-day report, write the handover, flag feedback for forecasting and scheduling</td></tr></table></div>
<h3>Traits of a strong RTA</h3>
<ul><li><b>Calm:</b> panic spreads faster than queues</li><li><b>Numerate:</b> comfortable turning raw numbers into agent gaps</li><li><b>Concise:</b> short messages that name an action and a time</li><li><b>Consistent:</b> same rules for everyone, every day</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>Real-time work is a loop of check, diagnose, act, communicate, review.</li><li>Looking ahead 2 to 4 intervals matters as much as the current one.</li></ul></div>
<div class="try"><b>Try it</b>Write your own 10-line "start of shift" checklist. You will refine it in Module 6.</div>`},
{t:"Ethics and professional boundaries",m:"10 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Apply core ethical rules to real-time data</li><li>Know when to escalate instead of act</li></ul></div>
<p>RTAs see everything: who logged in late, who took a long break, who is always off-schedule. That visibility comes with responsibility.</p>
<ul><li><b>Be fair.</b> Apply adherence rules and exceptions the same way to everyone.</li><li><b>Be accurate.</b> Check that a data issue is not the cause before flagging an agent.</li><li><b>Be discreet.</b> Share individual data only with people who need it, such as the agent's team lead.</li><li><b>Stay in your lane.</b> Detect and inform. Coaching and discipline belong to team leads, operations, and HR.</li><li><b>Escalate, do not guess.</b> If a decision costs money, changes contracts, or affects wellbeing, bring in a manager.</li><li><b>Be honest in reports.</b> Do not hide a missed target. Explain it.</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>Trust is the RTA's real currency. Agents who see fair treatment follow alerts quickly.</li></ul></div>
<div class="try"><b>Try it</b>An agent is 12 minutes late back from lunch, and the phone system had a 10-minute login issue. How would you record it, and who would you tell?</div>`}
];
const QZ=[["Which is the correct order of the WFM cycle?", ["Scheduling, forecasting, real-time, capacity planning", "Forecasting, capacity planning, staffing requirements, scheduling, real-time, reporting", "Reporting, real-time, scheduling, forecasting", "Forecasting, reporting, scheduling, real-time"], 1, "Forecasts feed capacity and staffing plans, plans feed schedules, schedules feed today's real-time work, and reporting feeds learning back."], ["Which stage of the cycle happens while customers are actually waiting?", ["Forecasting", "Scheduling", "Intraday / real-time management", "Capacity planning"], 2, "Real-time is the only stage that runs live."], ["Forecast: 120 calls in 30 minutes, AHT 300 sec. What is the workload in Erlangs?", ["10", "20", "30", "36"], 1, "120 x 300 / 1800 = 20 Erlangs."], ["Who normally owns formal disciplinary action for repeated adherence breaches?", ["The RTA", "The forecaster", "Operations and HR", "The scheduler"], 2, "RTAs detect and inform. Coaching and discipline sit with team leads, operations, and HR."], ["Eight agents are late back from lunch during a busy interval. What is the best first action?", ["Write them up immediately", "Send a targeted floor alert and ask team leads to nudge them", "Cancel all lunches tomorrow", "Ignore it until the end of day"], 1, "Start with the lightest effective response, then escalate if it persists."], ["Why should an RTA check data quality before flagging an agent?", ["It is not necessary", "A system or mapping error may be the real cause", "Agents prefer it", "It speeds up reports"], 1, "Fairness and accuracy depend on ruling out feed or mapping problems first."]];
const LAB=`<h3>Lab: Map the WFM cycle for your own center</h3>
<ol><li>Draw the six-stage WFM cycle on one page.</li><li>For each stage, write who owns it in your organization, what tool they use, and what they hand to the next stage.</li><li>Pick one real recent service level miss. Trace which stage was the most likely root cause.</li><li>Write a 5-line "RTA mission" statement for your own desk.</li></ol>
<div class="key"><b>Submit</b>A one-page PDF or image of your cycle map, plus the short root-cause note. Your instructor reviews it against the rubric: completeness, correct hand-offs, and a realistic root cause.</div>
<h3>What you learned</h3><ul><li>WFM balances service, cost, and agent experience.</li><li>The six-stage cycle, and that real-time is stage 5.</li><li>Who does what in a WFM team, and where the RTA fits.</li><li>The RTA mission, daily rhythm, and ethical boundaries.</li></ul>`;
// Lesson 1: staffing vs demand, interactive
V.balance=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas></canvas><div class="ctl"><label for="sl">Agents scheduled vs need: <b id="pc">100%</b></label><input id="sl" type="range" min="60" max="140" value="100"></div><p class="cap" id="bt"></p>');
 const s=el.querySelector('#sl'),bt=el.querySelector('#bt'),pc=el.querySelector('#pc');
 const need=[30,38,52,64,70,66,58,54,60,68,62,50,44,38,34,30];let t=0,id=0;
 const draw=()=>{fit();const W=c.width,H=c.height,n=need.length,bw=W/n,k=s.value/100,sc=H*.9/95;
  const ok=col('--ok'),bad=col('--bad'),ink=col('--ink');x.clearRect(0,0,W,H);let sh=0,ov=0;
  need.forEach((v,i)=>{const d=v+Math.sin(t+i)*3,st=v*k,short=st<d-3.5,over=st>d*1.15;
   x.globalAlpha=.8;x.fillStyle=short?bad:over?'#E0A21B':ok;x.fillRect(i*bw+3,H-st*sc,bw-6,st*sc);
   if(short)sh++;if(over)ov++});
  x.globalAlpha=1;x.strokeStyle=ink;x.lineWidth=2*D;x.beginPath();
  need.forEach((v,i)=>{const y=H-(v+Math.sin(t+i)*3)*sc,px=(i+.5)*bw;i?x.lineTo(px,y):x.moveTo(px,y)});x.stroke();
  pc.textContent=s.value+'%';
  bt.textContent=`Line = customer demand, bars = scheduled agents. ${sh} of ${n} intervals short (customers wait), ${ov} overstaffed (paid idle time). Drag the slider to find the balance.`};
 s.oninput=draw;
 const loop=()=>{t+=.03;draw();id=requestAnimationFrame(loop)};
 rm?draw():loop();
 return()=>cancelAnimationFrame(id)};

// Lesson 2: the six-stage WFM loop
V.cycle=el=>{
 const N=['Forecasting','Capacity planning','Requirements','Scheduling','Real-time','Reporting'],P='M200,35 A95,95 0 0,1 200,225 A95,95 0 0,1 200,35';
 let s=`<svg viewBox="0 0 400 265" style="width:100%;max-width:520px;display:block;margin:auto" role="img" aria-label="The six WFM stages arranged as a loop, with real-time highlighted"><path d="${P}" fill="none" stroke="var(--line)" stroke-width="3" stroke-dasharray="6 6"/>`;
 N.forEach((n,i)=>{const a=-Math.PI/2+i*Math.PI/3,cs=Math.cos(a),X=200+95*cs,Y=130+95*Math.sin(a),r=i==4;
  s+=`<circle cx="${X}" cy="${Y}" r="${r?16:12}" fill="${r?'var(--accent)':'var(--card)'}" stroke="var(--accent)" stroke-width="2">${r&&!rm?'<animate attributeName="r" values="16;20;16" dur="2s" repeatCount="indefinite"/>':''}</circle><text x="${X}" y="${Y+4}" text-anchor="middle" font-size="12" font-weight="700" fill="${r?'var(--on)':'var(--ink)'}">${i+1}</text>`;
  const an=cs>.3?'start':cs<-.3?'end':'middle',LX=X+(cs>.3?22:cs<-.3?-22:0),LY=Math.abs(cs)<=.3?(Y<130?Y-22:Y+32):Y+4;
  s+=`<text x="${LX}" y="${LY}" text-anchor="${an}" font-size="13" fill="var(--ink)"${r?' font-weight="800"':''}>${n}</text>`});
 s+=`<text x="200" y="126" text-anchor="middle" font-size="13" fill="var(--mute)">Reporting feeds</text><text x="200" y="144" text-anchor="middle" font-size="13" fill="var(--mute)">the next forecast</text>`;
 if(!rm)s+=`<circle r="6" fill="#F0B429"><animateMotion dur="12s" repeatCount="indefinite" path="${P}"/></circle>`;
 el.innerHTML=s+'</svg><p class="cap">The marker travels the loop. Stage 5 (Real-time) is the only stage that happens while customers are waiting.</p>';
 return()=>{}};

// Lesson 4: a live interval monitor, forecast vs actual
V.monitor=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas></canvas><p class="cap" id="mt"></p>'),mt=el.querySelector('#mt');
 const fc=[40,48,62,78,90,84,70,66,74,88,72,50],dv=[0,.02,-.03,.04,.05,.18,.27,.30,.22,.1,.05,0],n=12,ac=fc.map((v,i)=>v*(1+dv[i]));
 const val=q=>{const i=Math.min(n-1,Math.floor(q)),j=Math.min(n-1,i+1),f=q-i;return ac[i]+(ac[j]-ac[i])*f};
 let p=0,id=0;
 const draw=()=>{fit();const W=c.width,H=c.height,bw=W/n,sc=H*.88/120,Y=v=>H-v*sc,X=q=>(q+.5)*bw;
  const ink=col('--ink'),mute=col('--mute'),bad=col('--bad'),ok=col('--ok'),line=col('--line');x.clearRect(0,0,W,H);
  x.strokeStyle=line;x.lineWidth=D;for(let g=0;g<=4;g++){x.beginPath();x.moveTo(0,H-g*30*sc);x.lineTo(W,H-g*30*sc);x.stroke()}
  x.setLineDash([6*D,6*D]);x.strokeStyle=mute;x.lineWidth=2*D;x.beginPath();fc.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();x.setLineDash([]);
  const top=Math.min(p,n-1);x.lineWidth=3*D;
  for(let q=0;q<top;q+=.1){const e=Math.min(q+.1,top),d=val(q)/fc[Math.min(n-1,Math.round(q))]-1;x.strokeStyle=d>.1?bad:ok;x.beginPath();x.moveTo(X(q),Y(val(q)));x.lineTo(X(e),Y(val(e)));x.stroke()}
  x.strokeStyle=ink;x.lineWidth=D;x.beginPath();x.moveTo(X(top),0);x.lineTo(X(top),H);x.stroke();
  const i=Math.min(n-1,Math.floor(top)),d=Math.round((ac[i]/fc[i]-1)*100);
  mt.textContent=`Dashed = forecast, solid = actual calls per interval. Now: ${d>10?`volume ${d}% above forecast. Diagnose, choose a lever, communicate.`:`volume ${d>=0?'+':''}${d}% vs forecast. On track, keep monitoring.`}`};
 const loop=()=>{p+=.02;if(p>n+1.5)p=0;draw();id=requestAnimationFrame(loop)};
 if(rm){p=8;draw()}else loop();
 return()=>cancelAnimationFrame(id)};


Object.assign(M,{cp:"rta.html",course:"WFM Real-Time Analyst",k:"rta",nh:"rta-module-2.html"});
</script>
<script>
document.title=`Module ${M.n}: ${M.t} | ${M.course} | Carrow Academy`;
document.getElementById('h1').textContent=`Module ${M.n}: ${M.t}`;
document.getElementById('crumb').innerHTML=`<a href="index.html">Carrow Academy</a> / <a href="${M.cp}">${M.course}</a> / ${M.lvl}`;
const main=document.getElementById('main'),navEl=document.getElementById('nav');
const KEY='carrow-'+(M.k||'rta')+'-m'+M.n;
let cur=0,done=new Set(),total=LS.length+2;
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};
const names=[...LS.map((l,i)=>`${i+1}. ${l.t}`),"Knowledge check","Lab and wrap-up"];
function nav(){
  navEl.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${done.has(i)?'done':''}" ${i===cur?'aria-current="true"':''}><span class="dot">${done.has(i)?'&#10003;':i+1}</span><span class="nm">${n}</span></button>`).join('');
  navEl.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.getElementById('pb').style.width=(done.size/total*100)+'%';
  document.getElementById('pl').textContent=`${done.size} of ${total} complete`;
}
function foot(i){return `<div class="row"><button class="btn alt" ${i===0?'disabled':''} onclick="go(${i-1})">Previous</button><button class="btn" onclick="finish(${i})">${i===total-1?'Complete module':'Mark complete and continue'}</button></div>`}
function finish(i){done.add(i);save();if(i<total-1)go(i+1);else{nav();if(!main.querySelector('.res.fin'))main.insertAdjacentHTML('beforeend',`<p class="res fin">Module ${M.n} complete. Next: ${M.nh?`<a href="${M.nh}">${M.next}</a>`:`${M.next} (coming soon)`}. <a href="${M.cp}">Back to the course outline</a></p>`)}}
function go(i,quiet){
  cur=i;cleanup.forEach(f=>f());cleanup=[];
  if(i<LS.length){const l=LS[i];main.innerHTML=`<p class="pl">Lesson ${i+1} of ${LS.length}</p><h2>${l.t}</h2><p class="meta">${l.m} read</p>${l.h}${foot(i)}`}
  else if(i===LS.length){
    main.innerHTML=`<h2>Knowledge check</h2><p class="meta">${QZ.length} questions. Pass mark 70%.</p>`+QZ.map((q,n)=>`<div class="q" id="q${n}"><p>${n+1}. ${q[0]}</p>${shuf(q[1].map((o,k)=>[o,k])).map(([o,k])=>`<label><input type="radio" name="q${n}" value="${k}"> ${o}</label>`).join('')}<div class="fb"></div></div>`).join('')+`<button class="btn" id="chk">Check answers</button><div class="res" id="sc" role="status"></div>`+foot(i).replace('Mark complete and continue','Continue');
    document.getElementById('chk').onclick=()=>{let s=0;QZ.forEach((q,n)=>{const v=document.querySelector(`input[name=q${n}]:checked`),b=document.getElementById('q'+n),ok=v&&+v.value===q[2];if(ok)s++;b.className='q '+(ok?'right':'wrong');b.querySelector('.fb').textContent=(ok?'Correct. ':v?'Not quite. ':'Unanswered. ')+q[3]});const p=Math.round(s/QZ.length*100);document.getElementById('sc').textContent=`Score: ${s}/${QZ.length} (${p}%). ${p>=70?'Passed.':'Review the lessons and try again.'}`;if(p>=70){done.add(i);save();nav()}};
  } else main.innerHTML=`<h2>Lab and wrap-up</h2><p class="meta">${M.lab}</p>${LAB}${foot(i)}`;
  main.querySelectorAll('.viz').forEach(e=>cleanup.push(V[e.dataset.v](e)));
  nav();if(!quiet)main.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
}
addEventListener('carrow-theme',()=>{cleanup.forEach(f=>f());cleanup=[];main.querySelectorAll('.viz').forEach(e=>cleanup.push(V[e.dataset.v](e)))});
go(0,true);
</script>
<script>
/* Carrow Academy: animated data background. Include once per page, before </body>.
   Uses the page's --accent color. Respects reduced motion, pauses in hidden tabs. */
(()=>{
const lite=!!(navigator.connection&&navigator.connection.saveData)||(navigator.deviceMemory&&navigator.deviceMemory<=1);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches||lite;
const c=document.createElement('canvas');
c.setAttribute('aria-hidden','true');
c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';
document.body.prepend(c);
const x=c.getContext('2d');
let W,H,D,t=0,last=0,pts=[];
function size(){
  D=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
  pts=Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*2)*D,v:(.15+Math.random()*.35)*D}));
}
function draw(){
  const ac=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0F6E64';
  x.clearRect(0,0,W,H);x.strokeStyle=ac;x.fillStyle=ac;
  // data grid
  x.globalAlpha=.05;x.lineWidth=D;const g=80*D;
  for(let i=0;i<W;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=g){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  // flowing trend lines
  [[.28,.05,1,.5],[.42,.07,1.5,.8],[.58,.04,2.2,.35]].forEach(([b,a,f,s],k)=>{
    x.globalAlpha=.13-k*.03;x.lineWidth=2*D;x.beginPath();
    for(let i=0;i<=W;i+=8*D){
      const u=i/W,y=H*(b+a*Math.sin(u*6*f+t*s)+a*.5*Math.sin(u*13+t*s*1.7+k));
      i?x.lineTo(i,y):x.moveTo(i,y);
    }
    x.stroke();
  });
  // rising and falling interval bars
  x.globalAlpha=.06;const bw=26*D,n=Math.ceil(W/bw);
  for(let i=0;i<n;i++){
    const h=H*.13*(.5+.5*Math.sin(i*.45+t*.7))*(.6+.4*Math.sin(i*.17+t*.2));
    x.fillRect(i*bw,H-h,18*D,h);
  }
  // drifting data points
  x.globalAlpha=.15;
  pts.forEach(p=>{if(!rm){p.y-=p.v;if(p.y<-10)p.y=H+10}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
  x.globalAlpha=1;
}
function loop(ts){
  if(!last)last=ts;
  if(!document.hidden&&ts-last>33){t+=Math.min((ts-last)/1000,.1);last=ts;draw()}
  requestAnimationFrame(loop);
}
size();draw();
document.addEventListener('carrow-theme',draw);
addEventListener('resize',()=>{size();draw()});
addEventListener('carrow-theme',draw);
if(!rm)requestAnimationFrame(loop);
})();
</script>
