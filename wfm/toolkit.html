<style>/* Carrow Academy theme. Light and dark palettes. WCAG AA contrast checked. */

@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
<script>
(()=>{const d=document.documentElement,K='carrow-theme';
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const sys=()=>matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const get=()=>{try{return localStorage.getItem(K)}catch(e){return null}};
const apply=t=>{d.dataset.theme=t;const b=document.getElementById('theme-toggle');
 if(b){b.setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme');b.setAttribute('aria-pressed',t==='dark'?'true':'false');b.innerHTML=t==='dark'?SUN:MOON}
 const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0B1422':'#F4F7FB';
 dispatchEvent(new Event('carrow-theme'))};
apply(get()||sys());
document.addEventListener('DOMContentLoaded',()=>{
 let b=document.getElementById('theme-toggle');
 if(!b){const bar=document.createElement('nav');bar.className='topbar';bar.setAttribute('aria-label','Site');
  bar.innerHTML='<a class="brand" href="index.html">Carrow <span>Academy</span></a><div class="tn"><a href="index.html">Home</a><a href="index.html#courses">Courses</a><a href="toolkit.html">Toolkit</a></div><button id="theme-toggle" class="tt" type="button"></button>';
  document.body.prepend(bar);b=bar.querySelector('#theme-toggle')}
 b.onclick=()=>{const n=d.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem(K,n)}catch(e){}apply(n)};
 apply(d.dataset.theme)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',e=>{if(!get())apply(e.matches?'dark':'light')});
})();
</script>
<style>
:root{box-sizing:border-box}
:root{box-sizing:border-box}
html{scroll-padding-top:16px}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;margin:0 0 8px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--mute);margin:0 0 24px;max-width:62ch}
.tabs{display:flex;gap:6px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:22px}
.tabs button{font:inherit;font-weight:700;background:none;border:0;padding:10px 16px;color:var(--mute);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}

<body>
<main class="wrap">
  <h1>WFM Formula Toolkit</h1>
  <p class="sub">Calculate the core workforce management metrics used in contact centers. Change any number and results update instantly.</p>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <footer class="ft2">Carrow Academy. Staffing uses the Erlang C model (no abandonment, infinite queue), so treat results as a planning baseline.</footer>
</main>
<script>
const f=(n,d=1)=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:d}):'n/a';
const pc=(n,d=1)=>Number.isFinite(n)?f(n,d)+'%':'n/a';
const hr=n=>Number.isFinite(n)?f(n,2)+' hrs':'n/a';

function erlangC(N,A){if(N<=A)return 1;let B=1;for(let i=1;i<=N;i++)B=A*B/(i+A*B);return N*B/(N-A*(1-B));}
function staffing(A,aht,T,target){
  let N=Math.max(1,Math.ceil(A));
  for(let k=0;k<5000;k++,N++){
    if(N<=A)continue;
    const C=erlangC(N,A),sl=1-C*Math.exp(-(N-A)*T/aht);
    if(sl>=target)return{N,sl,asa:C*aht/(N-A),occ:A/N,pw:C};
  }
  return null;
}
function mape(txt){
  const rows=txt.split('\n').map(l=>l.split(/[,\s\t]+/).map(Number)).filter(r=>r.length>=2&&r.every(Number.isFinite)&&r[0]!==0);
  if(!rows.length)return null;
  const m=rows.reduce((s,[a,fc])=>s+Math.abs(a-fc)/Math.abs(a),0)/rows.length*100;
  const A=rows.reduce((s,r)=>s+r[0],0),F=rows.reduce((s,r)=>s+r[1],0);
  return{n:rows.length,m,A,F};
}

// [key,label,default,type]
const G={
"Staffing":[
 {t:"Required agents (Erlang C)",fm:"Erlangs = (Calls × AHT) ÷ Interval seconds. Agents are the smallest number that meets your service level, then grossed up for shrinkage.",
  i:[["calls","Calls in interval",100],["mins","Interval (minutes)",30],["aht","AHT (seconds)",300],["sl","Target service level %",80],["thr","Answer within (seconds)",20],["shr","Shrinkage %",30]],
  fn:v=>{const A=v.calls*v.aht/(v.mins*60),r=staffing(A,v.aht,v.thr,v.sl/100);
   if(!r)return[["Result","Check inputs"]];
   return[["Workload",hr(v.calls*v.aht/3600)],["Traffic (Erlangs)",f(A,2)],["Agents on the phone",f(r.N,0)],["Agents to schedule",f(Math.ceil(r.N/(1-v.shr/100)),0),1],["Service level achieved",pc(r.sl*100)],["ASA",f(r.asa,1)+' sec'],["Occupancy",pc(r.occ*100)],["Chance of waiting",pc(r.pw*100)]];}},
 {t:"Average Handle Time (AHT)",fm:"AHT = Talk time + Hold time + After-call work",
  i:[["talk","Talk time (sec)",240],["hold","Hold time (sec)",30],["acw","After-call work (sec)",45]],
  fn:v=>{const a=v.talk+v.hold+v.acw;return[["AHT (seconds)",f(a,0),1],["AHT (minutes)",f(a/60,2)]];}},
 {t:"Workload and traffic",fm:"Workload hrs = (Volume × AHT) ÷ 3600. Erlangs = (Volume × AHT) ÷ Interval seconds.",
  i:[["vol","Call volume",1200],["aht","AHT (seconds)",300],["mins","Interval (minutes)",60]],
  fn:v=>[["Workload",hr(v.vol*v.aht/3600),1],["Erlangs",f(v.vol*v.aht/(v.mins*60),2)]]},
 {t:"Shrinkage",fm:"Shrinkage % = (Paid hours − Productive hours) ÷ Paid hours × 100. Required staff = Agents ÷ (1 − Shrinkage).",
  i:[["paid","Paid hours",160],["prod","Productive hours",112],["req","Agents required on the floor",40]],
  fn:v=>{const s=(v.paid-v.prod)/v.paid*100;return[["Shrinkage",pc(s),1],["Lost hours",hr(v.paid-v.prod)],["Staff to schedule",f(Math.ceil(v.req/(1-s/100)),0)]];}},
 {t:"FTE requirement",fm:"FTE = Total required hours ÷ Hours per FTE",
  i:[["h","Total required hours",2400],["fh","Hours per FTE (period)",160]],
  fn:v=>[["FTE required",f(v.h/v.fh,2),1],["Rounded up",f(Math.ceil(v.h/v.fh),0)]]},
 {t:"Attrition-adjusted hiring",fm:"Hires needed = Required headcount − Current headcount + Expected attrition",
  i:[["req","Required headcount",120],["cur","Current headcount",110],["att","Expected leavers",8]],
  fn:v=>[["Hires needed",f(Math.max(0,v.req-v.cur+v.att),0),1],["Gap before attrition",f(v.req-v.cur,0)]]}
],
"Service & performance":[
 {t:"Service level",fm:"SL % = (Calls answered within threshold ÷ Calls offered) × 100",
  i:[["a","Answered within threshold",840],["o","Calls offered",1000]],
  fn:v=>[["Service level",pc(v.a/v.o*100),1]]},
 {t:"Average Speed of Answer (ASA)",fm:"ASA = Total wait time of answered calls ÷ Answered calls",
  i:[["w","Total wait time (sec)",18000],["n","Calls answered",950]],
  fn:v=>[["ASA",f(v.w/v.n,1)+' sec',1],["In minutes",f(v.w/v.n/60,2)]]},
 {t:"Abandonment rate",fm:"Abandonment % = (Abandoned calls ÷ Calls offered) × 100",
  i:[["ab","Abandoned calls",60],["o","Calls offered",1000]],
  fn:v=>[["Abandonment",pc(v.ab/v.o*100),1],["Answered",pc(100-v.ab/v.o*100)]]},
 {t:"Occupancy",fm:"Occupancy % = Handle time ÷ (Handle time + Available time) × 100",
  i:[["h","Handle time (hrs)",5.5],["av","Available / idle time (hrs)",1.5]],
  fn:v=>[["Occupancy",pc(v.h/(v.h+v.av)*100),1]]},
 {t:"Utilization",fm:"Utilization % = Productive time ÷ Paid time × 100",
  i:[["p","Productive time (hrs)",6],["pd","Paid time (hrs)",8]],
  fn:v=>[["Utilization",pc(v.p/v.pd*100),1]]}
],
"Adherence":[
 {t:"Schedule adherence",fm:"Adherence % = Time in adherence ÷ Total scheduled time × 100",
  i:[["a","Time in adherence (min)",420],["s","Scheduled time (min)",480]],
  fn:v=>[["Adherence",pc(v.a/v.s*100),1],["Out of adherence",f(v.s-v.a,0)+' min']]},
 {t:"Schedule conformance",fm:"Conformance % = Actual time worked ÷ Scheduled time × 100. It checks total hours, not when they were worked.",
  i:[["w","Actual time worked (min)",450],["s","Scheduled time (min)",480]],
  fn:v=>[["Conformance",pc(v.w/v.s*100),1]]},
 {t:"Absenteeism",fm:"Absenteeism % = Absent hours ÷ Scheduled hours × 100",
  i:[["a","Absent hours",96],["s","Scheduled hours",1600]],
  fn:v=>[["Absenteeism",pc(v.a/v.s*100),1]]}
],
"Forecasting":[
 {t:"Forecast accuracy (MAPE)",wide:1,fm:"MAPE = average of |Actual − Forecast| ÷ Actual × 100. Accuracy = 100 − MAPE. Enter one pair per line: actual, forecast.",
  i:[["d","Actual, Forecast (one pair per line)","520,500\n480,510\n610,580\n450,470\n700,650","area"]],
  fn:v=>{const r=mape(v.d);if(!r)return[["Result","Enter at least one valid pair (actual cannot be 0)"]];
   return[["MAPE",pc(r.m,2)],["Forecast accuracy",pc(100-r.m,2),1],["Total variance",pc((r.A-r.F)/r.F*100,2)],["Intervals used",f(r.n,0)]];}},
 {t:"Variance to forecast",fm:"Variance % = (Actual − Forecast) ÷ Forecast × 100. (MAPE divides by Actual instead, so check which convention your team uses.)",
  i:[["a","Actual",1080],["fc","Forecast",1000]],
  fn:v=>[["Variance",pc((v.a-v.fc)/v.fc*100,2),1],["Difference",f(v.a-v.fc,0)]]}
],
"Scheduling":[
 {t:"Coverage and schedule inefficiency",wide:1,fm:"Coverage % = 1 − Σ understaffed ÷ Σ required. Inefficiency % = Σ |scheduled − required| ÷ Σ required. Net variance % = (Σ scheduled − Σ required) ÷ Σ required. Hours ratio % = required ÷ scheduled. Enter one pair per line: required, scheduled.",
  i:[["d","Required, Scheduled (one pair per line, one line per interval)","20,22\n24,24\n28,26\n30,32\n26,28\n22,22\n18,16\n14,18","area"],["m","Interval length (minutes)",30]],
  fn:v=>{const r=v.d.split('\n').map(l=>l.split(/[,\s\t]+/).map(Number)).filter(a=>a.length>=2&&a.every(Number.isFinite));if(!r.length)return[["Result","Enter at least one valid pair"]];let q=0,s=0,u=0,o=0;r.forEach(([a,b])=>{q+=a;s+=b;u+=Math.max(0,a-b);o+=Math.max(0,b-a)});return[["Coverage",pc((1-u/q)*100,1),1],["Inefficiency",pc((u+o)/q*100,1)],["Net variance",pc((s-q)/q*100,1)],["Hours ratio",pc(q/s*100,1)],["Required hours",hr(q*v.m/60)],["Scheduled hours",hr(s*v.m/60)]];}}
],
"Cost & efficiency":[
 {t:"Cost per contact",fm:"Cost per contact = Total operating cost ÷ Contacts handled",
  i:[["c","Total operating cost",250000],["n","Contacts handled",42000]],
  fn:v=>[["Cost per contact",f(v.c/v.n,2),1]]},
 {t:"Contacts per agent per hour",fm:"Contacts per hour = Contacts handled ÷ Productive hours",
  i:[["n","Contacts handled",1800],["h","Productive hours",300]],
  fn:v=>[["Contacts per hour",f(v.n/v.h,2),1]]},
 {t:"Attrition rate",fm:"Attrition % = Agents who left ÷ Average headcount × 100",
  i:[["l","Agents who left",18],["h","Average headcount",120]],
  fn:v=>[["Attrition",pc(v.l/v.h*100),1]]}
]};

const tabs=document.getElementById('tabs'),grid=document.getElementById('grid');
function show(g){
  [...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.textContent===g));
  grid.innerHTML='';
  G[g].forEach((c,idx)=>{
    const el=document.createElement('section');el.className='card'+(c.wide?' wide':'');
    const id=`c${idx}`;
    el.innerHTML=`<h2>${c.t}</h2><p class="formula">${c.fm}</p><div class="ins">${c.i.map(([k,l,d,ty])=>ty==='area'
      ?`<label style="grid-column:1/-1">${l}<textarea data-k="${k}">${d}</textarea></label>`
      :`<label>${l}<input data-k="${k}" type="number" inputmode="decimal" step="any" value="${d}"></label>`).join('')}</div><div class="outs" aria-live="polite"></div>`;
    const out=el.querySelector('.outs');
    const run=()=>{const v={};el.querySelectorAll('[data-k]').forEach(x=>v[x.dataset.k]=x.tagName==='TEXTAREA'?x.value:parseFloat(x.value));
      out.innerHTML=c.fn(v).map(([l,val,p])=>`<div class="o${p?' p':''}"><span>${l}</span><b>${val}</b></div>`).join('');};
    el.addEventListener('input',run);run();grid.appendChild(el);
  });
}
Object.keys(G).forEach(g=>{const b=document.createElement('button');b.textContent=g;b.setAttribute('role','tab');b.onclick=()=>show(g);tabs.appendChild(b);});
show(Object.keys(G)[0]);
</script>
<script>
/* Carrow Academy: animated data background. Include once per page, before </body>.
   Uses the page's --accent color. Respects reduced motion, pauses in hidden tabs. */
(()=>{
const lite=!!(navigator.connection&&navigator.connection.saveData)||(navigator.deviceMemory&&navigator.deviceMemory<=1);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches||lite;
const c=document.createElement('canvas');
c.setAttribute('aria-hidden','true');
c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';
document.body.prepend(c);
const x=c.getContext('2d');
let W,H,D,t=0,last=0,pts=[];
function size(){
  D=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
  pts=Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*2)*D,v:(.15+Math.random()*.35)*D}));
}
function draw(){
  const ac=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0F6E64';
  x.clearRect(0,0,W,H);x.strokeStyle=ac;x.fillStyle=ac;
  // data grid
  x.globalAlpha=.05;x.lineWidth=D;const g=80*D;
  for(let i=0;i<W;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=g){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  // flowing trend lines
  [[.28,.05,1,.5],[.42,.07,1.5,.8],[.58,.04,2.2,.35]].forEach(([b,a,f,s],k)=>{
    x.globalAlpha=.13-k*.03;x.lineWidth=2*D;x.beginPath();
    for(let i=0;i<=W;i+=8*D){
      const u=i/W,y=H*(b+a*Math.sin(u*6*f+t*s)+a*.5*Math.sin(u*13+t*s*1.7+k));
      i?x.lineTo(i,y):x.moveTo(i,y);
    }
    x.stroke();
  });
  // rising and falling interval bars
  x.globalAlpha=.06;const bw=26*D,n=Math.ceil(W/bw);
  for(let i=0;i<n;i++){
    const h=H*.13*(.5+.5*Math.sin(i*.45+t*.7))*(.6+.4*Math.sin(i*.17+t*.2));
    x.fillRect(i*bw,H-h,18*D,h);
  }
  // drifting data points
  x.globalAlpha=.15;
  pts.forEach(p=>{if(!rm){p.y-=p.v;if(p.y<-10)p.y=H+10}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
  x.globalAlpha=1;
}
function loop(ts){
  if(!last)last=ts;
  if(!document.hidden&&ts-last>33){t+=Math.min((ts-last)/1000,.1);last=ts;draw()}
  requestAnimationFrame(loop);
}
size();draw();
document.addEventListener('carrow-theme',draw);
addEventListener('resize',()=>{size();draw()});
addEventListener('carrow-theme',draw);
if(!rm)requestAnimationFrame(loop);
})();
</script>
