<script>
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cleanup=[];const V={};
const col=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mkc=(el,h)=>{el.innerHTML=h;const c=el.querySelector('canvas'),D=Math.min(devicePixelRatio||1,2);
  const fit=()=>{const w=Math.round(c.clientWidth*D),hh=Math.round(c.clientHeight*D);if(c.width!==w||c.height!==hh){c.width=w;c.height=hh}};
  fit();return{c,x:c.getContext('2d'),D,fit}};
// Erlang C via the Erlang B recursion (numerically stable)
const ec=(N,A)=>{if(N<=A)return 1;let B=1;for(let i=1;i<=N;i++)B=A*B/(i+A*B);return N*B/(N-A*(1-B))};
const slv=(N,A,aht,T)=>N>A?1-ec(N,A)*Math.exp(-(N-A)*T/aht):0;
const asaf=(N,A,aht)=>N>A?ec(N,A)*aht/(N-A):Infinity;
const needN=(A,aht,T,tgt)=>{for(let N=Math.max(1,Math.ceil(A));N<5000;N++)if(N>A&&slv(N,A,aht,T)>=tgt)return N};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

<script>
const M={cp:"carrow-wfm-rta-course-page.html",course:"WFM Real-Time Analyst",k:"rta",n:3,t:"Core Metrics and WFM Math",lvl:"Level 1: Foundation",lab:"60 to 90 min",next:"Module 4, Schedules, Activities and Adherence Rules"};
const vz=(n,l)=>`<div class="viz" data-v="${n}" aria-live="off" role="group" aria-label="${l}"></div>`;
const LS=[
{t:"AHT, workload and Erlangs",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate AHT, workload hours and Erlangs</li><li>Explain why you always need more agents than Erlangs</li></ul></div>
<h3>Average handle time (AHT)</h3>
<p class="fm">AHT = Talk time + Hold time + After-call work (ACW)</p>
<p>Example: 240 + 30 + 45 = <b>315 seconds</b>. Across many contacts, AHT is total handle time divided by contacts handled. Some organizations include or exclude certain elements, so confirm your own definition.</p>
<h3>Workload and traffic (Erlangs)</h3>
<p class="fm">Workload hours = (Volume × AHT in seconds) ÷ 3,600<br>Erlangs (traffic intensity) = (Volume × AHT in seconds) ÷ Interval length in seconds</p>
<p>Example: 1,200 calls × 300 s ÷ 3,600 = <b>100 workload hours</b>. In a 30-minute interval, 100 calls × 300 s ÷ 1,800 = <b>16.67 Erlangs</b>. One Erlang equals one agent busy for the entire interval, so Erlangs are simply workload hours arriving per hour.</p>
${vz('workload','Interactive workload and Erlangs calculator')}
<div class="key"><b>Key takeaways</b><ul><li>Erlangs tell you the minimum number of fully busy agents the work represents.</li><li>You need more agents than Erlangs. Occupancy at N agents is Erlangs ÷ N.</li><li>Always match units: seconds with seconds, and interval length with volume.</li></ul></div>
<div class="try"><b>Try it</b>Calculate Erlangs for 150 calls in 30 minutes with AHT 240. Check it in the Carrow WFM Formula Toolkit.</div>`},
{t:"Service level, ASA and abandonment",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate service level, ASA and abandonment rate</li><li>Explain why ASA alone can mislead</li></ul></div>
<p class="fm">Service level % = Contacts answered within threshold ÷ Contacts offered × 100<br>ASA = Total wait time of answered contacts ÷ Contacts answered<br>Abandonment % = Abandoned contacts ÷ Contacts offered × 100</p>
<p>Examples: 840 ÷ 1,000 = <b>84%</b> service level. 18,000 s ÷ 950 answered = <b>18.9 s</b> ASA. 60 ÷ 1,000 = <b>6%</b> abandonment.</p>
<p><b>80/20</b> is shorthand for 80% of contacts answered within 20 seconds. Definitions vary between organizations and platforms, for example in how very short abandons are treated, so check how yours is calculated.</p>
<h3>Why ASA can mislead</h3>
<p>ASA is an average. Many instant answers can hide a minority of long waits. Move the threshold below and watch service level change while ASA stays fixed.</p>
${vz('waits','Interactive chart of wait times with a movable service level threshold')}
<div class="key"><b>Key takeaways</b><ul><li>Service level is a percentage of contacts. ASA is an average. They answer different questions.</li><li>Longer waits drive more abandonment, but abandonment makes waits look shorter than they really were.</li></ul></div>
<div class="try"><b>Try it</b>With a 20-second threshold, what service level do you see? Move the threshold to 10 and 40 seconds. Does ASA change?</div>`},
{t:"Occupancy, utilization, shrinkage and headcount",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Distinguish occupancy, utilization and shrinkage</li><li>Convert agents on the phone into agents to schedule</li></ul></div>
<p class="fm">Occupancy % = Handle time ÷ (Handle time + Available time) × 100<br>Utilization % = Productive time ÷ Paid time × 100<br>Shrinkage % = (Paid time − Productive time) ÷ Paid time × 100</p>
<p>Examples: occupancy 5.5 ÷ (5.5 + 1.5) = <b>78.6%</b>. Utilization 6 ÷ 8 = <b>75%</b>. Shrinkage (160 − 112) ÷ 160 = <b>30%</b>.</p>
<ul><li><b>Occupancy</b> measures how busy agents are while they are available. Targets are commonly 80 to 85%, and sustained levels above roughly 85 to 90% are widely treated as a burnout risk. Acceptable levels vary by team size and channel.</li><li><b>Utilization</b> is measured against all paid time, so it is always lower than occupancy. There is no single industry definition, so state yours.</li><li><b>Shrinkage</b> is paid time when agents cannot handle contacts, such as breaks, leave, training, meetings, absence and system downtime. Commonly quoted ranges are about 25 to 35%, but it varies a lot.</li></ul>
<h3>Applying shrinkage</h3>
<p class="fm">Agents to schedule = Agents required ÷ (1 − Shrinkage)</p>
<p>If 70 agents are needed on the phones and shrinkage is 30%, schedule 70 ÷ 0.70 = <b>100</b>. A common mistake is multiplying by (1 + shrinkage), which gives 91 and understaffs.</p>
${vz('waterfall','Interactive chart of how paid time splits into shrinkage, idle and handling')}
<div class="key"><b>Key takeaways</b><ul><li>Shrinkage is applied after the Erlang C requirement, by dividing, not multiplying.</li><li>Only a little over half of paid time is typically spent handling contacts.</li></ul></div>
<div class="try"><b>Try it</b>Set shrinkage to 30% and occupancy to 80%. What share of paid time is spent handling contacts?</div>`},
{t:"Erlang C: from workload to agents",m:"30 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Explain each step of the Erlang C method</li><li>Find the agents needed to hit a service level target</li><li>State its assumptions and limits</li></ul></div>
<p>Erlang C estimates how many agents you need so that a given share of contacts is answered within a threshold.</p>
<p class="fm">Pw = [A^N ÷ N! × N ÷ (N − A)] ÷ [ Σ (A^k ÷ k!) for k = 0 to N−1 + A^N ÷ N! × N ÷ (N − A) ]<br>Service level = 1 − Pw × e^( −(N − A) × T ÷ AHT )<br>ASA = Pw × AHT ÷ (N − A)<br>Occupancy = A ÷ N</p>
<p>Here A is the workload in Erlangs, N the number of agents, Pw the probability that a contact has to wait, T the threshold in seconds and AHT in seconds.</p>
<h3>The method</h3>
<ol><li>Calculate A from volume, AHT and interval length.</li><li>Start with N just above A.</li><li>Calculate Pw, then service level.</li><li>Add one agent at a time until the target is met.</li><li>Apply shrinkage to get agents to schedule.</li></ol>
<h3>Worked example (200 calls in an hour, AHT 180 s, 20 s threshold, so A = 10)</h3>
<div class="sc"><table><tr><th>Agents</th><th>Chance of waiting</th><th>Service level</th><th>ASA</th><th>Occupancy</th></tr>
<tr><td>11</td><td>68.2%</td><td>39.0%</td><td>122.8 s</td><td>90.9%</td></tr>
<tr><td>12</td><td>44.9%</td><td>64.0%</td><td>40.4 s</td><td>83.3%</td></tr>
<tr><td>13</td><td>28.5%</td><td>79.6%</td><td>17.1 s</td><td>76.9%</td></tr>
<tr><td>14</td><td>17.4%</td><td>88.8%</td><td>7.8 s</td><td>71.4%</td></tr></table></div>
<p>13 agents just miss 80/20 at 79.6%, so you need <b>14</b>. Notice the cliff: going from 11 to 14 agents lifts service level from 39% to 89%.</p>
${vz('slcurve','Interactive service level curve showing how many agents are needed')}
<h3>Assumptions and limits</h3>
<ul><li>Contacts arrive randomly (Poisson) and handle times are exponential.</li><li>Agents are identical, handle one contact at a time and serve in first-come order.</li><li>Customers never abandon. Because of this, Erlang C is generally conservative and tends to overstate the staff needed. Erlang A models abandonment.</li><li>Real handle-time distributions often differ from exponential.</li><li>It does not cover chat concurrency or complex multi-skill routing, where simulation is used.</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>Treat Erlang C as a strong baseline, not an exact prediction.</li><li>Small agent shortfalls near the workload cause large service level drops.</li></ul></div>
<div class="try"><b>Try it</b>Set 120 calls, AHT 300, threshold 20 on the chart. How many agents does 80/20 need, and what is the occupancy?</div>`},
{t:"Adherence, conformance, absence and headcount planning",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate adherence, conformance, absenteeism and attrition</li><li>Explain why 100% conformance does not mean good adherence</li></ul></div>
<p class="fm">Adherence % = Time in adherence ÷ Scheduled time × 100<br>Conformance % = Actual time worked ÷ Scheduled time × 100<br>Absenteeism % = Absent hours ÷ Scheduled hours × 100<br>Attrition % = Leavers ÷ Average headcount × 100<br>FTE = Required hours ÷ Hours per FTE</p>
<p>Examples: 432 ÷ 480 = <b>90%</b> adherence. 450 ÷ 480 = <b>93.75%</b> conformance. 96 ÷ 1,600 = <b>6%</b> absenteeism. 18 ÷ 120 = <b>15%</b> attrition. 2,400 ÷ 160 = <b>15 FTE</b>. State the period for attrition (monthly or annual) so numbers compare fairly.</p>
<h3>Adherence is about timing. Conformance is about total hours.</h3>
<p>Adherence asks whether the agent was in the right state at the right time. Conformance asks whether the agent worked the total hours scheduled. Many centers treat roughly 85 to 95% as an acceptable adherence range, with targets set by each organization. Adjust the example below.</p>
${vz('adh','Interactive comparison of adherence and conformance for a late lunch')}
<h3>Hiring need (planning shorthand)</h3>
<p class="fm">Hires needed = Required headcount − Current headcount + Expected leavers</p>
<div class="key"><b>Key takeaways</b><ul><li>An agent can have perfect conformance and poor adherence.</li><li>Always state the period and the exact definition used.</li></ul></div>
<div class="try"><b>Try it</b>At what lunch delay does adherence drop below 90%?</div>`},
{t:"Forecast accuracy and cost metrics",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate variance, MAPE, accuracy and WAPE</li><li>Calculate cost per contact and contacts per agent hour</li></ul></div>
<p class="fm">Variance % = (Actual − Forecast) ÷ Forecast × 100<br>MAPE = average of ( |Actual − Forecast| ÷ Actual ) × 100<br>Forecast accuracy = 100 − MAPE<br>WAPE = Σ|Actual − Forecast| ÷ ΣActual × 100<br>Cost per contact = Total operating cost ÷ Contacts handled<br>Contacts per hour = Contacts handled ÷ Productive hours</p>
<p>Example: forecast 1,000, actual 1,080 gives <b>+8%</b> variance. For actuals 520, 480, 610, 450, 700 against forecasts 500, 510, 580, 470, 650, MAPE is <b>5.32%</b>, accuracy <b>94.68%</b> and WAPE <b>5.43%</b>. Cost per contact 250,000 ÷ 42,000 = <b>5.95</b>. 1,800 contacts ÷ 300 hours = <b>6</b> per hour.</p>
<ul><li>MAPE treats each interval equally. WAPE weights by volume, which better reflects staffing cost.</li><li>MAPE breaks down when an actual is zero, so use WAPE then.</li><li>Variance divides by forecast and MAPE divides by actual. Conventions differ, so confirm which your team uses.</li><li>Forecast AHT too. A 10% AHT miss is a 10% workload miss even when volume is exact.</li><li>Accuracy is lower at the interval level than for a day or week, and targets vary by center.</li></ul>
${vz('mape','Interactive forecast bias and accuracy chart')}
<div class="key"><b>Key takeaways</b><ul><li>Bias shows up quickly in MAPE, so feed variance patterns back to forecasters.</li></ul></div>
<div class="try"><b>Try it</b>Apply a +10% forecast bias. What happens to accuracy?</div>`}
];

V.workload=el=>{
 el.innerHTML='<div class="ctl"><label for="wc">Calls in 30 minutes: <b id="wcv">100</b></label><input id="wc" type="range" min="20" max="200" value="100"></div><div class="ctl"><label for="wa">AHT (seconds): <b id="wav">300</b></label><input id="wa" type="range" min="120" max="480" step="10" value="300"></div><div id="wg" style="display:flex;flex-wrap:wrap;gap:3px;margin:10px 0"></div><p class="cap" id="wt"></p>';
 const c=el.querySelector('#wc'),a=el.querySelector('#wa'),g=el.querySelector('#wg'),t=el.querySelector('#wt');
 const run=()=>{const calls=+c.value,aht=+a.value,A=calls*aht/1800,n=Math.ceil(A)+1;
  el.querySelector('#wcv').textContent=calls;el.querySelector('#wav').textContent=aht;
  g.innerHTML=Array.from({length:n},(_,i)=>{const fill=Math.max(0,Math.min(1,A-i));return `<span style="width:16px;height:16px;border-radius:3px;border:1px solid var(--accent);background:linear-gradient(to top,var(--accent) ${fill*100}%,transparent ${fill*100}%)"></span>`}).join('');
  t.textContent=`${f1(calls*aht/3600,2)} hours of work arrive in a 30-minute interval, so workload = ${f1(calls*aht/3600,2)} ÷ 0.5 = ${f1(A,2)} Erlangs. Each square is one agent busy for the whole interval. You need at least ${Math.floor(A)+1} agents just to keep up (${f1(A/(Math.floor(A)+1)*100,0)}% occupancy), and more to keep waits short.`};
 c.oninput=a.oninput=run;run();return()=>{}};

V.waits=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas></canvas><div class="ctl"><label for="wt2">Service level threshold: <b id="wtv">20</b> seconds</label><input id="wt2" type="range" min="5" max="60" value="20"></div><p class="cap" id="wx"></p>');
 const s=el.querySelector('#wt2'),wx=el.querySelector('#wx');
 const W=Array.from({length:40},(_,i)=>i<16?i%4:Math.round(-30*Math.log(1-(i-16+.5)/24)));
 const asa=W.reduce((p,v)=>p+v,0)/W.length,mx=Math.max(...W);
 const draw=()=>{fit();const w=c.width,h=c.height,T=+s.value,ok=col('--ok'),bad=col('--bad'),ink=col('--ink'),bw=w/W.length;
  x.clearRect(0,0,w,h);const y=v=>h-v/mx*h*.88-4*D;
  W.forEach((v,i)=>{x.fillStyle=v<=T?ok:bad;x.globalAlpha=.85;x.fillRect(i*bw+1,Math.min(y(v),h-6*D),bw-2,Math.max(2*D,h-y(v)-4*D))});
  x.globalAlpha=1;x.setLineDash([6*D,5*D]);x.strokeStyle=ink;x.lineWidth=2*D;x.beginPath();x.moveTo(0,y(T));x.lineTo(w,y(T));x.stroke();x.setLineDash([]);
  x.fillStyle=col('--mute');x.textAlign='left';x.font=`${12*D}px system-ui,sans-serif`;x.fillText('Each bar = one call. Taller = longer wait.',8*D,16*D);const within=W.filter(v=>v<=T).length;
  el.querySelector('#wtv').textContent=T;
  wx.textContent=`Each bar is one answered call, sorted by wait. Green waited within ${T} s. Service level = ${within} ÷ ${W.length} = ${f1(within/W.length*100,1)}%. ASA = ${f1(asa,1)} s and does not change with the threshold.`};
 s.oninput=draw;draw();return()=>{}};

V.waterfall=el=>{
 el.innerHTML='<div class="ctl"><label for="ws">Shrinkage: <b id="wsv">30</b>%</label><input id="ws" type="range" min="10" max="45" value="30"></div><div class="ctl"><label for="wo">Occupancy: <b id="wov">80</b>%</label><input id="wo" type="range" min="50" max="95" value="80"></div><div id="wb" style="display:flex;height:34px;border-radius:6px;overflow:hidden;margin:10px 0;font-size:.8rem;font-weight:700"></div><p class="cap" id="wc2"></p>';
 const s=el.querySelector('#ws'),o=el.querySelector('#wo'),b=el.querySelector('#wb'),t=el.querySelector('#wc2');
 const run=()=>{const sh=+s.value/100,oc=+o.value/100,avail=1-sh,idle=avail*(1-oc),hand=avail*oc;
  el.querySelector('#wsv').textContent=s.value;el.querySelector('#wov').textContent=o.value;
  const seg=(w,bg,l,fg)=>`<div style="width:${w*100}%;background:${bg};color:${fg};display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden">${w>.12?l:''}</div>`;
  b.innerHTML=seg(sh,'#556677','Shrinkage','#fff')+seg(idle,'#E0A21B','Idle','#2A1D00')+seg(hand,'#0B6B5F','Handling','#fff');
  t.textContent=`Of every paid hour: ${f1(sh*100,0)}% is shrinkage, ${f1(idle*100,0)}% is available but idle, and ${f1(hand*100,0)}% is spent handling contacts. Utilization-style view: only ${f1(hand*100,0)}% of paid time handles contacts.`};
 s.oninput=o.oninput=run;run();return()=>{}};

V.slcurve=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas></canvas><div class="ctl"><label for="sc1">Calls in 30 min: <b id="sc1v">120</b></label><input id="sc1" type="range" min="40" max="240" value="120"></div><div class="ctl"><label for="sc2">AHT (s): <b id="sc2v">300</b></label><input id="sc2" type="range" min="120" max="480" step="10" value="300"></div><div class="ctl"><label for="sc3">Threshold (s): <b id="sc3v">20</b></label><input id="sc3" type="range" min="10" max="60" step="5" value="20"></div><p class="cap" id="sct"></p>');
 const r1=el.querySelector('#sc1'),r2=el.querySelector('#sc2'),r3=el.querySelector('#sc3'),sct=el.querySelector('#sct');
 const draw=()=>{fit();const calls=+r1.value,aht=+r2.value,T=+r3.value,A=calls*aht/1800,w=c.width,h=c.height;
  el.querySelector('#sc1v').textContent=calls;el.querySelector('#sc2v').textContent=aht;el.querySelector('#sc3v').textContent=T;
  const N0=Math.floor(A)+1,K=14,bw=w/K,ok=col('--ok'),bad=col('--bad'),ink=col('--ink'),mute=col('--mute'),best=needN(A,aht,T,.8);
  x.clearRect(0,0,w,h);x.font=`${11*D}px Figtree,system-ui,sans-serif`;
  for(let k=0;k<K;k++){const N=N0+k,s=slv(N,A,aht,T),bh=s*h*.82;x.fillStyle=N===best?ok:s>=.8?ok:bad;x.globalAlpha=N===best?1:.55;x.fillRect(k*bw+3,h-bh-16*D,bw-6,bh);x.globalAlpha=1;x.fillStyle=mute;x.textAlign='center';x.fillText(N,k*bw+bw/2,h-3*D)}
  x.strokeStyle=ink;x.setLineDash([6*D,5*D]);x.lineWidth=2*D;const ty=h-.8*h*.82-16*D;x.beginPath();x.moveTo(0,ty);x.lineTo(w,ty);x.stroke();x.setLineDash([]);
  sct.textContent=`Workload ${f1(A,2)} Erlangs. Bars show service level for each agent count (labels below). Dashed line = 80% target. You need ${best} agents (occupancy ${f1(A/best*100,0)}%, ASA ${f1(asaf(best,A,aht),1)} s). Schedule ${Math.ceil(best/.7)} with 30% shrinkage.`};
 r1.oninput=r2.oninput=r3.oninput=draw;draw();return()=>{}};

V.adh=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas style="height:150px"></canvas><div class="ctl"><label for="al">Lunch taken late by: <b id="alv">60</b> minutes</label><input id="al" type="range" min="0" max="90" step="5" value="60"></div><p class="cap" id="at"></p>');
 const s=el.querySelector('#al'),at=el.querySelector('#at');
 const draw=()=>{fit();const X=+s.value,w=c.width,h=c.height,ok=col('--ok'),bad=col('--bad'),mute=col('--mute'),ink=col('--ink'),L=180,u=w/L;
  el.querySelector('#alv').textContent=X;x.clearRect(0,0,w,h);x.font=`${12*D}px Figtree,system-ui,sans-serif`;x.fillStyle=ink;
  x.fillText('Schedule (a 3-hour window around lunch)',4*D,16*D);x.fillText('What actually happened',4*D,h*.55-6*D);
  const lane=(y,l0)=>{x.fillStyle=mute;x.globalAlpha=.25;x.fillRect(0,y,w,26*D);x.globalAlpha=1;x.fillStyle='#E0A21B';x.fillRect(l0*u,y,30*u,26*D);x.fillStyle=ink;x.fillText('Lunch',l0*u+4*D,y+17*D)};
  lane(24*D,30);lane(h*.55,30+X);
  const out=2*Math.min(30,X);
  x.fillStyle=bad;x.globalAlpha=.5;
  const segs=[];if(X>0){segs.push([30,30+Math.min(X,30)]);segs.push([Math.max(60,30+X),30+X+30])}
  segs.forEach(([a,b])=>{x.fillRect(a*u,h*.82,(b-a)*u,8*D)});x.globalAlpha=1;
  const adh=(480-out)/480*100;
  at.textContent=`Red marks minutes where the agent is not doing what the schedule says: ${out} minutes. Adherence for the day = (480 − ${out}) ÷ 480 = ${f1(adh,1)}%. Conformance = 100%, because every scheduled hour was still worked.`};
 s.oninput=draw;draw();return()=>{}};

V.mape=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas></canvas><div class="ctl"><label for="mb">Forecast bias: <b id="mbv">0</b>%</label><input id="mb" type="range" min="-20" max="20" value="0"></div><p class="cap" id="mt2"></p>');
 const A=[520,480,610,450,700,560,640,500],F=[500,510,580,470,650,575,630,520],s=el.querySelector('#mb'),mt=el.querySelector('#mt2');
 const draw=()=>{fit();const b=+s.value/100,w=c.width,h=c.height,bw=w/A.length,sc=h*.85/800,ink=col('--ink'),ac=col('--accent'),bad=col('--bad');
  el.querySelector('#mbv').textContent=s.value;x.clearRect(0,0,w,h);
  const fc=F.map(v=>v*(1+b));let sum=0,ea=0,aa=0;
  A.forEach((a,i)=>{const f=fc[i];sum+=Math.abs(a-f)/a;ea+=Math.abs(a-f);aa+=a;x.fillStyle=ac;x.globalAlpha=.4;x.fillRect(i*bw+6,h-f*sc,bw-12,f*sc);x.globalAlpha=1;
   x.strokeStyle=bad;x.lineWidth=2*D;x.beginPath();x.moveTo(i*bw+bw/2,h-a*sc);x.lineTo(i*bw+bw/2,h-f*sc);x.stroke();
   x.fillStyle=ink;x.beginPath();x.arc(i*bw+bw/2,h-a*sc,5*D,0,6.3);x.fill()});
  const m=sum/A.length*100;
  mt.textContent=`Bars = forecast, dots = actual, red lines = error. MAPE = ${f1(m,2)}%, forecast accuracy = ${f1(100-m,2)}%, WAPE = ${f1(ea/aa*100,2)}%.`};
 s.oninput=draw;draw();return()=>{}};

<script>

   Uses the page's --accent color. Respects reduced motion, pauses in hidden tabs. */
(()=>{
const lite=!!(navigator.connection&&navigator.connection.saveData)||(navigator.deviceMemory&&navigator.deviceMemory<=1);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches||lite;
const c=document.createElement('canvas');
c.setAttribute('aria-hidden','true');
c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';

function size(){
  D=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
  pts=Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*2)*D,v:(.15+Math.random()*.35)*D}));

function draw(){

  for(let i=0;i<W;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=g){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  // flowing trend lines
  [[.28,.05,1,.5],[.42,.07,1.5,.8],[.58,.04,2.2,.35]].forEach(([b,a,f,s],k)=>{
    x.globalAlpha=.13-k*.03;x.lineWidth=2*D;x.beginPath();
    for(let i=0;i<=W;i+=8*D){
      const u=i/W,y=H*(b+a*Math.sin(u*6*f+t*s)+a*.5*Math.sin(u*13+t*s*1.7+k));
      i?x.lineTo(i,y):x.moveTo(i,y);
    }
    x.stroke();
  });
  // rising and falling interval bars
  x.globalAlpha=.06;const bw=26*D,n=Math.ceil(W/bw);
  for(let i=0;i<n;i++){
    const h=H*.13*(.5+.5*Math.sin(i*.45+t*.7))*(.6+.4*Math.sin(i*.17+t*.2));
    x.fillRect(i*bw,H-h,18*D,h);
  }
  // drifting data points
  x.globalAlpha=.15;
  pts.forEach(p=>{if(!rm){p.y-=p.v;if(p.y<-10)p.y=H+10}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
  x.globalAlpha=1;
}
function loop(ts){
  if(!last)last=ts;
  if(!document.hidden&&ts-last>33){t+=Math.min((ts-last)/1000,.1);last=ts;draw()}
  requestAnimationFrame(loop);
}
size();draw();
document.addEventListener('carrow-theme',draw);
addEventListener('resize',()=>{size();draw()});
addEventListener('carrow-theme',draw);
if(!rm)requestAnimationFrame(loop);
})();
</script>
