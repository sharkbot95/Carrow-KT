// Erlang C via the Erlang B recursion (numerically stable)
const ec=(N,A)=>{if(N<=A)return 1;let B=1;for(let i=1;i<=N;i++)B=A*B/(i+A*B);return N*B/(N-A*(1-B))};

const M={n:1,t:"From Data to Decisions",lvl:"Level 1: Foundation",lab:"45 to 60 min",next:"Module 2, Data Sources and Data Quality"};
const vz=(n,l)=>`<div class="viz" data-v="${n}" aria-live="off" role="group" aria-label="${l}"></div>`;
const LS=[
{t:"Why we report: inputs, outputs and outcomes",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Sort metrics into inputs, outputs and outcomes</li><li>Trace a service level result back to its drivers</li></ul></div>
<p>Good reporting turns data into a decision. It helps to group metrics by where they sit in the cause chain:</p>
<div class="sc"><table><tr><th>Group</th><th>Meaning</th><th>Examples</th></tr><tr><td>Inputs (drivers)</td><td>What you can plan and influence</td><td>Volume, AHT, scheduled staff, shrinkage, adherence</td></tr><tr><td>Outputs</td><td>What the operation delivers</td><td>Service level, ASA, abandonment, occupancy</td></tr><tr><td>Outcomes</td><td>What the business cares about</td><td>Cost per contact, customer satisfaction, attrition</td></tr></table></div>
<p>Change a driver below and watch the result move. Planned for 100 calls in 30 minutes, AHT 300 s, and 21 agents for 80/20.</p>
${vz('drivers','Interactive driver tree from volume, AHT and staffing to service level')}
<div class="key"><b>Key takeaways</b><ul><li>Report outputs, but explain them with inputs.</li><li>A miss usually has more than one cause, so look at all the drivers together.</li></ul></div>
<div class="try"><b>Try it</b>Find a combination of volume, AHT and staffing changes that keeps service level at about 80%.</div>`},
{t:"Report types and cadence",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Match a report to its audience and decision</li><li>Choose a sensible cadence</li></ul></div>
<div class="sc"><table><tr><th>Report</th><th>Cadence</th><th>Audience</th><th>Decision it supports</th></tr>
<tr><td>Intraday snapshot</td><td>Every 30 to 60 minutes</td><td>Real-time team, operations</td><td>Move people now</td></tr>
<tr><td>Daily summary</td><td>Each morning</td><td>Operations managers</td><td>What happened and what to fix today</td></tr>
<tr><td>Weekly performance</td><td>Weekly</td><td>Managers and WFM</td><td>Adjust schedules, coaching, forecast</td></tr>
<tr><td>Monthly review</td><td>Monthly</td><td>Senior leaders</td><td>Hiring, budget, targets</td></tr>
<tr><td>Incident report</td><td>After an event</td><td>Everyone affected</td><td>Prevent a repeat</td></tr></table></div>
<h3>Design rules</h3>
<ul><li>One report, one audience, one main question.</li><li>Lead with the headline, then the numbers, then the actions.</li><li>Use the same definitions in every report.</li><li>If a report never changes a decision, change it or retire it.</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>Cadence follows how fast a decision can be taken.</li><li>Different audiences need different detail from the same data.</li></ul></div>
<div class="try"><b>Try it</b>List the reports your center produces. For each, name the decision it supports.</div>`},
{t:"Variance analysis: forecast versus actual",m:"30 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Split a workload variance into volume and AHT effects</li><li>Explain a missed interval in numbers</li></ul></div>
<p>Workload depends on volume and AHT, so a gap between forecast and actual has two sources. Splitting them tells you whether to challenge the volume forecast or the AHT assumption.</p>
<p class="fm">Workload = Volume × AHT ÷ 3,600 (hours)<br>Volume effect = (Actual volume − Forecast volume) × Forecast AHT ÷ 3,600<br>AHT effect = Actual volume × (Actual AHT − Forecast AHT) ÷ 3,600<br>Volume effect + AHT effect = Actual workload − Forecast workload</p>
<p>The AHT effect uses actual volume so the two effects add up exactly with nothing left over. Another convention assigns the combined term separately, so say which one you use.</p>
${vz('waterfall','Interactive waterfall splitting a workload variance into volume and AHT effects')}
<div class="key"><b>Key takeaways</b><ul><li>Volume and AHT misses call for different fixes.</li><li>Convert both to hours so they can be compared and added.</li></ul></div>
<div class="try"><b>Try it</b>Keep total workload the same but make volume higher and AHT lower. What happens to the two effects?</div>`},
{t:"Definitions: one metric, many numbers",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Show how definitions change a reported number</li><li>Write a metric dictionary entry</li></ul></div>
<p>Service level is often given as "calls answered within the threshold ÷ calls offered", but platforms and contracts differ in how abandoned calls are treated. Some count every abandon, some exclude very short abandons, some divide by answered calls only. The same day can give very different results:</p>
<p class="fm">A: answered in threshold ÷ offered<br>B: answered in threshold ÷ (offered − short abandons)<br>C: answered in threshold ÷ answered<br>D: (answered in threshold + abandoned in threshold) ÷ (answered + abandoned)<br>Abandon rate (excluding short) = (Abandons − Short abandons) ÷ (Offered − Short abandons)</p>
${vz('defs','Interactive comparison of service level definitions on the same day of data')}
<h3>A metric dictionary entry</h3>
<ul><li><b>Name:</b> Service level</li><li><b>Formula:</b> exact numerator and denominator</li><li><b>Inclusions and exclusions:</b> short abandons, callbacks, transfers, channels</li><li><b>Threshold:</b> for example 20 seconds</li><li><b>Source and owner:</b> system and team</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>Never compare numbers across systems or contracts without checking definitions.</li><li>Document every metric once and use it everywhere.</li></ul></div>
<div class="try"><b>Try it</b>How many short abandons would it take for definition B to reach 85%?</div>`},
{t:"Thresholds, alerts and dashboards",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Set a traffic-light rule that flags what matters</li><li>Explain alert fatigue</li></ul></div>
<p>A dashboard should show what is wrong and how wrong, quickly. A common approach is green (on target), amber (slightly below) and red (well below). If thresholds are too tight, everything is flagged and people stop looking. If they are too loose, real problems hide. The strip below shows service level for each interval of a day.</p>
${vz('rag','Interactive traffic-light strip of service level by interval with adjustable thresholds')}
<h3>Dashboard principles</h3>
<ul><li>Put the most important number first and make it large.</li><li>Use colour for status, not decoration, and never rely on colour alone.</li><li>Show the target next to the actual.</li><li>Allow drill-down from summary to interval.</li></ul>
<div class="key"><b>Key takeaways</b><ul><li>Thresholds are decisions: set them from the cost of being wrong, not from habit.</li><li>Fewer, clearer alerts beat many noisy ones.</li></ul></div>
<div class="try"><b>Try it</b>Set the amber band to 2 points. How many intervals are red, and does that match what you would act on?</div>`}

const LAB=`<h3>Lab: Explain a miss</h3>
<ol><li>In Lesson 1, set volume +10%, AHT +10% and staffing −5%. Record service level and ASA. Which single change hurts most when applied alone?</li><li>In Lesson 3, use forecast 1,000 calls at 300 s and actual 1,200 calls at 285 s. Calculate the volume effect, AHT effect and total variance in hours.</li><li>In Lesson 4, find the number of short abandons that makes definition A and definition B differ by at least 3 points.</li><li>Write a five-line daily summary for operations: headline, two causes with numbers, and one action.</li></ol>
<details><summary><b>Check your numbers</b></summary><p>Step 2: forecast workload 83.33 h; actual 1,200 × 285 ÷ 3,600 = 95.0 h. Volume effect = 200 × 300 ÷ 3,600 = 16.67 h. AHT effect = 1,200 × (−15) ÷ 3,600 = −5.0 h. Total variance = +11.67 h (16.67 − 5.0). Steps 1 and 3 depend on your slider settings.</p></details>
<div class="key"><b>Submit</b>Your numbers and the five-line summary.</div>
<h3>What you learned</h3><ul><li>Inputs, outputs and outcomes, and how drivers affect service level.</li><li>Report types, cadence and audience.</li><li>Splitting a workload variance into volume and AHT effects.</li><li>Why definitions matter and how to document them.</li><li>Thresholds, alert fatigue and dashboard principles.</li></ul>`;

V.drivers=el=>{
 el.innerHTML='<div class="ctl"><label for="dv">Volume vs forecast: <b id="dvv">0</b>%</label><input id="dv" type="range" min="-20" max="30" value="0"></div><div class="ctl"><label for="da">AHT vs forecast: <b id="dav">0</b>%</label><input id="da" type="range" min="-20" max="30" value="0"></div><div class="ctl"><label for="ds">Staff available vs plan: <b id="dsv">0</b>%</label><input id="ds" type="range" min="-30" max="20" value="0"></div><div id="dt" class="pipe"></div><p class="cap" id="dx"></p>';
 const g=id=>el.querySelector(id),R=['#dv','#da','#ds'].map(g),Af=100*300/1800,N0=needN(Af,300,20,.8);
 const run=()=>{const [v,a,s]=R.map(r=>+r.value);['v','a','s'].forEach((k,i)=>g('#d'+k+'v').textContent=(R[i].value>0?'+':'')+R[i].value);
  const A=Af*(1+v/100)*(1+a/100),N=Math.max(1,Math.round(N0*(1+s/100))),sl=slv(N,A,300,20)*100,asa=asaf(N,A,300),oc=Math.min(1,A/N)*100;
  const B=[['Volume',f1(100*(1+v/100),0)+' calls','forecast 100'],['AHT',f1(300*(1+a/100),0)+' s','forecast 300 s'],['Workload',f1(A,1)+' Erlangs','forecast 16.7'],['Agents',N,`plan ${N0}`],['Service level',f1(sl,1)+'%','target 80%'],['Occupancy',f1(oc,0)+'%',Number.isFinite(asa)?`ASA ${f1(asa,0)} s`:'queue keeps growing']];
  g('#dt').innerHTML=B.map((b,k)=>`<div class="b ${k===4?(sl>=80?'on':''):''}" ${k===4&&sl<80?'style="border-color:var(--bad)"':''}><span class="n">${k+1}</span><b>${b[0]}</b><span>${b[1]}</span><small>${b[2]}</small></div>`).join('');
  g('#dx').textContent=A>=N?'Workload is at or above the number of agents, so the queue grows and service level collapses.':`Service level ${f1(sl,1)}% against a target of 80%. Planned for ${N0} agents.`};
 R.forEach(r=>r.oninput=run);run();return()=>{}};

V.waterfall=el=>{
 const{c,x,D,fit}=mkc(el,'<canvas></canvas><div class="ctl"><label for="wv0">Forecast volume: <b id="wv0v">1000</b></label><input id="wv0" type="range" min="200" max="3000" step="50" value="1000"></div><div class="ctl"><label for="wv1">Actual volume: <b id="wv1v">1100</b></label><input id="wv1" type="range" min="200" max="3000" step="50" value="1100"></div><div class="ctl"><label for="wa0">Forecast AHT (s): <b id="wa0v">300</b></label><input id="wa0" type="range" min="120" max="600" step="10" value="300"></div><div class="ctl"><label for="wa1">Actual AHT (s): <b id="wa1v">330</b></label><input id="wa1" type="range" min="120" max="600" step="10" value="330"></div><p class="cap" id="wt"></p>');
 const g=id=>el.querySelector(id),R=['#wv0','#wv1','#wa0','#wa1'].map(g);
 const draw=()=>{fit();const [v0,v1,a0,a1]=R.map(r=>+r.value);['wv0','wv1','wa0','wa1'].forEach((k,i)=>g('#'+k+'v').textContent=R[i].value);
  const W0=v0*a0/3600,W1=v1*a1/3600,ve=(v1-v0)*a0/3600,ae=v1*(a1-a0)/3600,w=c.width,h=c.height,mx=Math.max(W0,W1,W0+ve,W1-ae)*1.2,y=v=>h-24*D-v/mx*(h-40*D),bw=w/4,ok=col('--ok'),bad=col('--bad'),ac=col('--accent'),ink=col('--ink'),mute=col('--mute');
  x.clearRect(0,0,w,h);x.font=`${12*D}px system-ui,sans-serif`;x.textAlign='center';
  const bar=(i,from,to,cl,lb,val)=>{const t=Math.min(y(from),y(to)),hh=Math.max(2*D,Math.abs(y(from)-y(to)));x.fillStyle=cl;x.globalAlpha=.85;x.fillRect(i*bw+bw*.15,t,bw*.7,hh);x.globalAlpha=1;x.fillStyle=ink;x.fillText(val,i*bw+bw/2,t-5*D);x.fillStyle=mute;x.fillText(lb,i*bw+bw/2,h-6*D)};
  bar(0,0,W0,ac,'Forecast',f1(W0,1)+' h');bar(1,W0,W0+ve,ve>=0?bad:ok,'Volume effect',(ve>=0?'+':'')+f1(ve,1)+' h');bar(2,W0+ve,W0+ve+ae,ae>=0?bad:ok,'AHT effect',(ae>=0?'+':'')+f1(ae,1)+' h');bar(3,0,W1,ac,'Actual',f1(W1,1)+' h');
  g('#wt').textContent=`Forecast workload ${f1(W0,2)} h. Volume effect ${f1(ve,2)} h = (${v1} − ${v0}) × ${a0} ÷ 3,600. AHT effect ${f1(ae,2)} h = ${v1} × (${a1} − ${a0}) ÷ 3,600. Actual workload ${f1(W1,2)} h. Check: ${f1(W0,2)} + ${f1(ve,2)} + ${f1(ae,2)} = ${f1(W0+ve+ae,2)}.`};
 R.forEach(r=>r.oninput=draw);draw();return()=>{}};

V.defs=el=>{
 el.innerHTML='<div class="ctl"><label for="fo">Calls offered: <b id="fov">1000</b></label><input id="fo" type="range" min="500" max="2000" step="50" value="1000"></div><div class="ctl"><label for="fa">Answered within 20 s: <b id="fav">780</b></label><input id="fa" type="range" min="300" max="1500" step="10" value="780"></div><div class="ctl"><label for="fl">Answered after 20 s: <b id="flv">150</b></label><input id="fl" type="range" min="0" max="500" step="10" value="150"></div><div class="ctl"><label for="fs">Short abandons (under 5 s): <b id="fsv">25</b></label><input id="fs" type="range" min="0" max="100" step="5" value="25"></div><div class="ctl"><label for="fw">Abandons within 20 s (including short): <b id="fwv">40</b></label><input id="fw" type="range" min="0" max="150" step="5" value="40"></div><div id="ft"></div><p class="cap" id="fx"></p>';
 const g=id=>el.querySelector(id),R=['#fo','#fa','#fl','#fs','#fw'].map(g);
 const run=()=>{let [o,a,l,s,w]=R.map(r=>+r.value);['o','a','l','s','w'].forEach((k,i)=>g('#f'+k+'v').textContent=R[i].value);
  const ab=Math.max(0,o-a-l),sh=Math.min(s,ab),aw=Math.min(Math.max(w,sh),ab);
  const rows=[['A: answered in 20 s ÷ offered',a/o*100],['B: ÷ (offered − short abandons)',o-sh>0?a/(o-sh)*100:0],['C: ÷ answered only',a+l>0?a/(a+l)*100:0],['D: (answered in 20 s + abandoned in 20 s) ÷ (answered + abandoned)',a+l+ab>0?(a+aw)/(a+l+ab)*100:0]];
  g('#ft').innerHTML=rows.map(([l,v])=>`<div class="lbl"><span>${l}</span><b>${f1(v,1)}%</b></div><div class="meter ${v<80?'bad':''}"><i style="width:${Math.min(100,v)}%"></i></div>`).join('');
  g('#fx').textContent=`Abandoned calls: ${ab} (${f1(ab/o*100,1)}% of offered). Abandon rate including short abandons ${f1(ab/o*100,1)}%; excluding short abandons ${f1(o-sh>0?(ab-sh)/(o-sh)*100:0,1)}%. Same day, four service levels.${a+l+ab!==o?' Inputs do not add up to offered calls, so the remainder is treated as unanswered.':''}`};
 R.forEach(r=>r.oninput=run);run();return()=>{}};

V.rag=el=>{
 const SL=[91,88,84,79,72,68,74,81,85,83,77,70,66,73,80,86,89,92,94,90,87,93,95,96];
 const tl=i=>{const m=480+i*30;return String(Math.floor(m/60)).padStart(2,'0')+':'+(m%60?'30':'00')};
 el.innerHTML='<div class="ctl"><label for="gt">Target: <b id="gtv">80</b>%</label><input id="gt" type="range" min="60" max="95" value="80"></div><div class="ctl"><label for="gb">Amber band below target: <b id="gbv">5</b> points</label><input id="gb" type="range" min="0" max="20" value="5"></div><div id="gs" style="display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin:10px 0"></div><p class="cap" id="gx"></p>';
 const g=id=>el.querySelector(id),gt=g('#gt'),gb=g('#gb');
 const run=()=>{const t=+gt.value,b=+gb.value;g('#gtv').textContent=t;g('#gbv').textContent=b;let G=0,A=0,Rd=0;
  g('#gs').innerHTML=SL.map((v,i)=>{const s=v>=t?'g':v>=t-b?'a':'r';if(s==='g')G++;else if(s==='a')A++;else Rd++;const bg=s==='g'?'#0B6B5F':s==='a'?'#E0A21B':'#B3261E',fg=s==='a'?'#2A1D00':'#fff',lb=s==='g'?'On target':s==='a'?'Slightly below':'Well below';return `<div style="background:${bg};color:${fg};border-radius:6px;padding:6px 2px;text-align:center;font-size:.78rem;line-height:1.2"><div>${tl(i)}</div><b>${v}%</b><div>${lb}</div></div>`}).join('');
  g('#gx').textContent=`Of 24 intervals: ${G} on target, ${A} slightly below (amber), ${Rd} well below (red). Each tile shows its status in words as well as colour. Flagged intervals (amber plus red): ${A+Rd}.${A+Rd>12?' More than half the day is flagged, which risks alert fatigue.':''}`};
 gt.oninput=gb.oninput=run;run();return()=>{}};

Object.assign(M,{cp:"reporting.html",course:"WFM Reporting and Analytics",k:"reporting",nh:null});
</script>
<script>
document.title=`Module ${M.n}: ${M.t} | ${M.course} | Carrow Academy`;
document.getElementById('h1').textContent=`Module ${M.n}: ${M.t}`;
document.getElementById('crumb').innerHTML=`<a href="index.html">Carrow Academy</a> / <a href="${M.cp}">${M.course}</a> / ${M.lvl}`;
const main=document.getElementById('main'),navEl=document.getElementById('nav');
const KEY='carrow-'+(M.k||'rta')+'-m'+M.n;
let cur=0,done=new Set(),total=LS.length+2;
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}};
const names=[...LS.map((l,i)=>`${i+1}. ${l.t}`),"Knowledge check","Lab and wrap-up"];
function nav(){
  navEl.innerHTML=names.map((n,i)=>`<button data-i="${i}" class="${done.has(i)?'done':''}" ${i===cur?'aria-current="true"':''}><span class="dot">${done.has(i)?'&#10003;':i+1}</span><span class="nm">${n}</span></button>`).join('');
  navEl.querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.i));
  document.getElementById('pb').style.width=(done.size/total*100)+'%';
  document.getElementById('pl').textContent=`${done.size} of ${total} complete`;
}
function foot(i){return `<div class="row"><button class="btn alt" ${i===0?'disabled':''} onclick="go(${i-1})">Previous</button><button class="btn" onclick="finish(${i})">${i===total-1?'Complete module':'Mark complete and continue'}</button></div>`}
function finish(i){done.add(i);save();if(i<total-1)go(i+1);else{nav();if(!main.querySelector('.res.fin'))main.insertAdjacentHTML('beforeend',`<p class="res fin">Module ${M.n} complete. Next: ${M.nh?`<a href="${M.nh}">${M.next}</a>`:`${M.next} (coming soon)`}. <a href="${M.cp}">Back to the course outline</a></p>`)}}
function go(i,quiet){
  cur=i;cleanup.forEach(f=>f());cleanup=[];
  if(i<LS.length){const l=LS[i];main.innerHTML=`<p class="pl">Lesson ${i+1} of ${LS.length}</p><h2>${l.t}</h2><p class="meta">${l.m} read</p>${l.h}${foot(i)}`}
  else if(i===LS.length){
    main.innerHTML=`<h2>Knowledge check</h2><p class="meta">${QZ.length} questions. Pass mark 70%.</p>`+QZ.map((q,n)=>`<div class="q" id="q${n}"><p>${n+1}. ${q[0]}</p>${shuf(q[1].map((o,k)=>[o,k])).map(([o,k])=>`<label><input type="radio" name="q${n}" value="${k}"> ${o}</label>`).join('')}<div class="fb"></div></div>`).join('')+`<button class="btn" id="chk">Check answers</button><div class="res" id="sc" role="status"></div>`+foot(i).replace('Mark complete and continue','Continue');
    document.getElementById('chk').onclick=()=>{let s=0;QZ.forEach((q,n)=>{const v=document.querySelector(`input[name=q${n}]:checked`),b=document.getElementById('q'+n),ok=v&&+v.value===q[2];if(ok)s++;b.className='q '+(ok?'right':'wrong');b.querySelector('.fb').textContent=(ok?'Correct. ':v?'Not quite. ':'Unanswered. ')+q[3]});const p=Math.round(s/QZ.length*100);document.getElementById('sc').textContent=`Score: ${s}/${QZ.length} (${p}%). ${p>=70?'Passed.':'Review the lessons and try again.'}`;if(p>=70){done.add(i);save();nav()}};
  } else main.innerHTML=`<h2>Lab and wrap-up</h2><p class="meta">${M.lab}</p>${LAB}${foot(i)}`;
  main.querySelectorAll('.viz').forEach(e=>cleanup.push(V[e.dataset.v](e)));
  nav();if(!quiet)main.scrollIntoView({behavior:rm?'auto':'smooth',block:'start'});
}
addEventListener('carrow-theme',()=>{cleanup.forEach(f=>f());cleanup=[];main.querySelectorAll('.viz').forEach(e=>cleanup.push(V[e.dataset.v](e)))});
go(0,true);
</script>
<script>
/* Carrow Academy: animated data background. Include once per page, before </body>.
   Uses the page's --accent color. Respects reduced motion, pauses in hidden tabs. */
(()=>{
const lite=!!(navigator.connection&&navigator.connection.saveData)||(navigator.deviceMemory&&navigator.deviceMemory<=1);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches||lite;
const c=document.createElement('canvas');
c.setAttribute('aria-hidden','true');
c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';
document.body.prepend(c);
const x=c.getContext('2d');
let W,H,D,t=0,last=0,pts=[];
function size(){
  D=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
  pts=Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*2)*D,v:(.15+Math.random()*.35)*D}));
}
function draw(){
  const ac=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0F6E64';
  x.clearRect(0,0,W,H);x.strokeStyle=ac;x.fillStyle=ac;
  // data grid
  x.globalAlpha=.05;x.lineWidth=D;const g=80*D;
  for(let i=0;i<W;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=g){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  // flowing trend lines
  [[.28,.05,1,.5],[.42,.07,1.5,.8],[.58,.04,2.2,.35]].forEach(([b,a,f,s],k)=>{
    x.globalAlpha=.13-k*.03;x.lineWidth=2*D;x.beginPath();
    for(let i=0;i<=W;i+=8*D){
      const u=i/W,y=H*(b+a*Math.sin(u*6*f+t*s)+a*.5*Math.sin(u*13+t*s*1.7+k));
      i?x.lineTo(i,y):x.moveTo(i,y);
    }
    x.stroke();
  });
  // rising and falling interval bars
  x.globalAlpha=.06;const bw=26*D,n=Math.ceil(W/bw);
  for(let i=0;i<n;i++){
    const h=H*.13*(.5+.5*Math.sin(i*.45+t*.7))*(.6+.4*Math.sin(i*.17+t*.2));
    x.fillRect(i*bw,H-h,18*D,h);
  }
  // drifting data points
  x.globalAlpha=.15;
  pts.forEach(p=>{if(!rm){p.y-=p.v;if(p.y<-10)p.y=H+10}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
  x.globalAlpha=1;
}
function loop(ts){
  if(!last)last=ts;
  if(!document.hidden&&ts-last>33){t+=Math.min((ts-last)/1000,.1);last=ts;draw()}
  requestAnimationFrame(loop);
}
size();draw();
document.addEventListener('carrow-theme',draw);
addEventListener('resize',()=>{size();draw()});
addEventListener('carrow-theme',draw);
if(!rm)requestAnimationFrame(loop);
})();
</script>
