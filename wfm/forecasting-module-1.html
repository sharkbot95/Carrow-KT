<script>
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cleanup=[];const V={};

const mkc=(el,h)=>{el.innerHTML=h;const c=el.querySelector('canvas'),D=Math.min(devicePixelRatio||1,2);
  const fit=()=>{const w=Math.round(c.clientWidth*D),hh=Math.round(c.clientHeight*D);if(c.width!==w||c.height!==hh){c.width=w;c.height=hh}};
  fit();return{c,x:c.getContext('2d'),D,fit}};
// Erlang C via the Erlang B recursion (numerically stable)
const ec=(N,A)=>{if(N<=A)return 1;let B=1;for(let i=1;i<=N;i++)B=A*B/(i+A*B);return N*B/(N-A*(1-B))};
const slv=(N,A,aht,T)=>N>A?1-ec(N,A)*Math.exp(-(N-A)*T/aht):0;
const asaf=(N,A,aht)=>N>A?ec(N,A)*aht/(N-A):Infinity;
const needN=(A,aht,T,tgt)=>{for(let N=Math.max(1,Math.ceil(A));N<5000;N++)if(N>A&&slv(N,A,aht,T)>=tgt)return N};
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const f1=(n,d=1)=>Number.isFinite(n)?n.toLocaleString(undefined,{maximumFractionDigits:d}):'n/a';

{t:"What a forecast is",m:"20 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Say what a contact forecast contains and who uses it</li><li>Break a yearly forecast into month, day and interval</li></ul></div>
<p>A <b>forecast</b> predicts two things for every future interval: how many contacts will arrive (<b>volume</b>) and how long each will take (<b>AHT</b>). Together they give workload, which capacity planning, scheduling and real-time management all depend on. Because contacts arrive at different rates through the year, the week and the day, forecasts are built in layers.</p>
<p class="fm">Month volume = Annual volume ÷ 12 × Month index<br>Daily average = Month volume ÷ Days in month<br>Day volume = Daily average × Day-of-week index<br>Interval volume = Day volume × Interval share</p>
<p>An <b>index</b> is a period's average divided by the overall average, so 1.10 means 10% above average and the indexes average 1.00. Move the sliders to follow one interval all the way from the annual number to an agent requirement.</p>
${vz('cascade','Interactive cascade from annual volume to one interval and the agents it needs')}
<div class="key"><b>Key takeaways</b><ul><li>Forecast volume and AHT separately, then combine them into workload.</li><li>Each layer (year, month, day, interval) has its own pattern.</li></ul></div>
<div class="try"><b>Try it</b>Pick a Saturday in July at 08:00. How many calls do you expect, and how does that compare with a Monday in November at 11:30?</div>`},
{t:"The parts of a time series",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Name the components of contact volume history</li><li>Recognise each component on a chart</li></ul></div>
<p>Historical volume is the sum of several parts:</p>
<div class="sc"><table><tr><th>Component</th><th>What it is</th><th>Contact center example</th></tr><tr><td>Level</td><td>The typical size</td><td>About 1,000 calls a week</td></tr><tr><td>Trend</td><td>Steady rise or fall</td><td>Customer base growing 1% a month</td></tr><tr><td>Seasonality</td><td>A repeating pattern</td><td>Busier Mondays, a pre-holiday rise</td></tr><tr><td>Events</td><td>One-off or planned effects</td><td>A billing run, an outage, a campaign</td></tr><tr><td>Noise</td><td>Random variation</td><td>Normal week-to-week wobble</td></tr></table></div>
<p>Contact arrivals typically show an <b>intraday cycle</b> (busy mornings, quiet nights) and an <b>intraweek cycle</b> (busy Mondays, quiet weekends) at the same time. Build a series below, then switch components off to see what each contributes.</p>
${vz('decomp','Interactive time series built from trend, seasonality, an event and noise')}
<div class="key"><b>Key takeaways</b><ul><li>A forecast method is good at the parts it models and blind to the parts it does not.</li><li>Noise cannot be forecast, so aim to capture level, trend, seasonality and known events.</li></ul></div>
<div class="try"><b>Try it</b>Turn on only trend and events, then only seasonality. Which one would you ask an operations manager about?</div>`},
{t:"Seasonality and indexes",m:"25 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate a seasonal index</li><li>Use indexes to turn a yearly total into monthly forecasts</li></ul></div>
<p class="fm">Seasonal index = Average for the period ÷ Overall average<br>Month forecast = (Next year total ÷ 12) × Month index</p>
<p>Example: if January averages 105,000 calls across three years and the overall monthly average is 100,000, January's index is 1.05. When volume is growing, first compare each month with its own year's average so growth does not leak into the index, then average those ratios across years.</p>
${vz('seasidx','Interactive seasonal index chart and next-year forecast')}
<div class="key"><b>Key takeaways</b><ul><li>Indexes separate the shape of the year from its size.</li><li>Three or more years of history make indexes much more reliable.</li></ul></div>
<div class="try"><b>Try it</b>Raise next year's growth to 8%. Which month has the largest increase in calls, and why?</div>`},
{t:"Simple forecasting methods",m:"30 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate a moving average and exponential smoothing forecast</li><li>Explain the trade-off between responsiveness and stability</li></ul></div>
<p class="fm">Moving average of n periods = (A(t) + A(t−1) + ... + A(t−n+1)) ÷ n<br>Exponential smoothing: F(t+1) = α × A(t) + (1 − α) × F(t)</p>
<p>In exponential smoothing, α (alpha) is between 0 and 1. A high α reacts quickly but copies noise. A low α is stable but slow to notice a real change. Research on call arrivals found that for longer lead times a simple historical average is hard to beat, while methods such as Holt-Winters exponential smoothing and seasonal ARIMA do better for predictions a few days ahead. The series below has a real level shift at week 25.</p>
${vz('smooth','Interactive moving average and exponential smoothing against weekly volume')}
<div class="key"><b>Key takeaways</b><ul><li>There is no best α. Choose by testing on data the model has not seen.</li><li>Start simple. Add complexity only if it measurably improves accuracy.</li></ul></div>
<div class="try"><b>Try it</b>Find an α that gives the lowest MAPE. Then try a window of 4 and a window of 12. What happens after week 25?</div>`},
{t:"Forecast error and what it costs",m:"30 min",h:`
<div class="obj"><b>By the end of this lesson you can</b><ul><li>Calculate MAPE, WAPE and bias</li><li>Show why under-forecasting costs more than over-forecasting</li></ul></div>
<p class="fm">Error = Actual − Forecast<br>MAPE = average of |Actual − Forecast| ÷ Actual × 100<br>WAPE = Σ|Actual − Forecast| ÷ ΣActual × 100<br>Bias = (ΣForecast − ΣActual) ÷ ΣActual × 100</p>
<p>MAPE and WAPE measure size of error. Bias measures direction: a forecast that is always 5% high has a bias of +5% even if it is never wildly wrong. Sign conventions differ, so state yours. Now see what error does to a real interval: staff for the forecast, then let the actual volume arrive.</p>
${vz('errcost','Interactive chart of service level and occupancy as actual volume differs from forecast')}
<h3>What this shows</h3>
<p>The model assumes 100 forecast calls in 30 minutes, AHT 300 s and an 80/20 target, which needs 21 agents. A 10% shortfall in forecast (actual 110 calls) drops service level from about 83% to about 63%. A 10% over-forecast raises service level to about 93% but leaves occupancy at about 71%. Under-forecasting hurts customers quickly, while over-forecasting costs money quietly. Both come from the same size of error.</p>
<div class="key"><b>Key takeaways</b><ul><li>Measure both accuracy (MAPE or WAPE) and bias.</li><li>The cost of error is not symmetric. Use the chart to show decision makers.</li></ul></div>
<div class="try"><b>Try it</b>At what error does service level fall below 50%? At what error does occupancy pass 90%?</div>`}

try{done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}

<script>
/* Carrow Academy: animated data background. Include once per page, before </body>.
   Uses the page's --accent color. Respects reduced motion, pauses in hidden tabs. */
(()=>{
const lite=!!(navigator.connection&&navigator.connection.saveData)||(navigator.deviceMemory&&navigator.deviceMemory<=1);
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches||lite;
const c=document.createElement('canvas');
c.setAttribute('aria-hidden','true');
c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none';
document.body.prepend(c);
const x=c.getContext('2d');
let W,H,D,t=0,last=0,pts=[];
function size(){
  D=Math.min(devicePixelRatio||1,2);W=c.width=Math.round(innerWidth*D);H=c.height=Math.round(innerHeight*D);
  pts=Array.from({length:36},()=>({x:Math.random()*W,y:Math.random()*H,r:(1+Math.random()*2)*D,v:(.15+Math.random()*.35)*D}));
}
function draw(){
  const ac=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0F6E64';
  x.clearRect(0,0,W,H);x.strokeStyle=ac;x.fillStyle=ac;
  // data grid
  x.globalAlpha=.05;x.lineWidth=D;const g=80*D;
  for(let i=0;i<W;i+=g){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}
  for(let j=0;j<H;j+=g){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
  // flowing trend lines
  [[.28,.05,1,.5],[.42,.07,1.5,.8],[.58,.04,2.2,.35]].forEach(([b,a,f,s],k)=>{
    x.globalAlpha=.13-k*.03;x.lineWidth=2*D;x.beginPath();
    for(let i=0;i<=W;i+=8*D){
      const u=i/W,y=H*(b+a*Math.sin(u*6*f+t*s)+a*.5*Math.sin(u*13+t*s*1.7+k));
      i?x.lineTo(i,y):x.moveTo(i,y);
    }
    x.stroke();
  });
  // rising and falling interval bars
  x.globalAlpha=.06;const bw=26*D,n=Math.ceil(W/bw);
  for(let i=0;i<n;i++){
    const h=H*.13*(.5+.5*Math.sin(i*.45+t*.7))*(.6+.4*Math.sin(i*.17+t*.2));
    x.fillRect(i*bw,H-h,18*D,h);
  }
  // drifting data points
  x.globalAlpha=.15;
  pts.forEach(p=>{if(!rm){p.y-=p.v;if(p.y<-10)p.y=H+10}x.beginPath();x.arc(p.x,p.y,p.r,0,6.3);x.fill()});
  x.globalAlpha=1;
}
function loop(ts){
  if(!last)last=ts;
  if(!document.hidden&&ts-last>33){t+=Math.min((ts-last)/1000,.1);last=ts;draw()}
  requestAnimationFrame(loop);
}
size();draw();
document.addEventListener('carrow-theme',draw);
addEventListener('resize',()=>{size();draw()});
addEventListener('carrow-theme',draw);
if(!rm)requestAnimationFrame(loop);
})();
</script>
